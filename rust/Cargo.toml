[package]
name = "szgc"
version = "1.0.0"
edition = "2021"
description = "SZGC — morphographic predictive text codec (integer-only, deterministic)"
license = "MIT"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "szgc"
path = "src/main.rs"

[lib]
name = "szgc"
path = "src/lib.rs"
